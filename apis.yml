name: Enjoei
description: 'Enjoei is a Brazilian online marketplace (brechó) for buying and selling new and pre-owned
  fashion, shoes, accessories, electronics, furniture, home goods, and collectibles. Founded in 2009 and
  headquartered in Sao Paulo, it operates a peer-to-peer resale platform and mobile app ("enjuapp") that
  connects individual sellers and buyers, handling listings, payments, shipping, and buyer/seller protection.
  Enjoei is publicly traded on Brazil''s B3 exchange (ticker ENJU3). It was surfaced as a portfolio company
  of Bessemer Venture Partners. No public developer API, MCP server, or SDKs were found during enrichment;
  this profile carries the consumer-facing identity and a domain-security probe.'
